name: Aggiorna dati NBA

on:
  schedule:
    # Controllo ogni ora (pochi secondi). L'aggiornamento vero parte solo:
    # - 3 ore dopo la fine dell'ultima partita della giornata
    # - alle 10 e alle 19 italiane per le linee dei bookmaker
    - cron: "0 * * * *"
  workflow_dispatch: # "Run workflow": aggiorna subito, linee comprese

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Serve aggiornare?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else node scripts/should-update.mjs; fi
      - name: Scarica i dati
        if: steps.check.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/update-data.mjs
      - name: Salva
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json defense-cache.json
          [ -f odds-cache.json ] && git add odds-cache.json || true
          [ -f update-state.json ] && git add update-state.json || true
          git diff --cached --quiet || git commit -m "Aggiorna dati $(date -u +%Y-%m-%d\ %H:%M)"
          git push
